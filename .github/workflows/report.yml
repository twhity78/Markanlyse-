name: Marktbericht generieren

on:
  schedule:
    - cron: "0 6 * * 1"  # montags um 06:00 UTC
  workflow_dispatch:       # manuell auslösbar

permissions:
  contents: write

jobs:
  generate:
    name: Bericht erstellen & committen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Bericht generieren
        run: npm run generate

      - name: Bericht committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "report: $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Bericht als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: marktbericht-${{ github.run_id }}
          path: reports/
          retention-days: 90
